[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taac2026"
dynamic = ["version"]
description = "TAAC 2026 experiment workspace"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
classifiers = [
	"Operating System :: POSIX :: Linux",
]
dependencies = [
	"datasets==5.0.1",
	"loguru==0.7.3",
	"matplotlib==3.11.1",
	"ninja==1.13.0",
	"numpy==2.5.1",
	"orjson==3.11.9",
	"pyarrow==25.0.0",
	"pydantic==2.13.4",
	"rich==15.0.0",
	"safetensors==0.8.0",
	"scikit-learn==1.9.0",
	"tilelang==0.1.12",
	"tensorboard==2.21.0",
	"tomli==2.4.1",
	"tqdm==4.70.0",
	"triton==3.7.1",
	"tyro==1.0.15",
]

[project.optional-dependencies]
dev = [
	"hypothesis==6.164.0",
	"pytest==9.1.1",
	"pytest-benchmark==5.2.3",
	"pytest-cov==7.1.0",
	"ruff==0.16.1",
	"vulture==2.16",
	"zensical==0.0.52",
]
cuda132 = [
	"torch==2.13.0+cu132",
]

[tool.uv.sources]
torch = [
	{ index = "pytorch-cu132", extra = "cuda132" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'"]

[project.scripts]
taac-train = "taac2026.application.training.cli:main"
taac-evaluate = "taac2026.application.evaluation.cli:main"
taac-package-train = "taac2026.application.packaging.cli:training_main"
taac-package-infer = "taac2026.application.packaging.cli:inference_main"
taac-generate-pcvr-synthetic-dataset = "taac2026.application.benchmarking.generate_pcvr_synthetic_dataset:main"
taac-benchmark-pcvr-data-pipeline = "taac2026.application.benchmarking.pcvr_data_pipeline_benchmark:main"
taac-benchmark-pcvr-inference = "taac2026.application.benchmarking.pcvr_inference_benchmark:main"
taac-benchmark-pcvr-optimizer = "taac2026.application.benchmarking.pcvr_optimizer_benchmark:main"
taac-benchmark-pcvr-tilelang-ops = "taac2026.application.benchmarking.pcvr_tilelang_ops_benchmark:main"
taac-plot-pcvr-diagnostics = "taac2026.application.benchmarking.pcvr_diagnostic_plots:main"
taac-analysis-learning-trace = "taac2026.application.analysis.learning_trace:main"

[tool.setuptools.dynamic]
version = {attr = "taac2026.__version__"}

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"taac2026.infrastructure.data.native" = ["*.cpp"]
"taac2026.infrastructure.accelerators.embedding.kernels" = ["*.cu"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
	"unit: fast unit tests for pure logic and local contracts",
	"contract: stable module and experiment package interface tests",
	"integration: higher-level workflow tests across module boundaries",
	"gpu: tests that require a CUDA GPU (skipped automatically when unavailable)",
	"benchmark_cpu: CPU-safe benchmark tests that run in automatic CI",
	"benchmark_gpu: GPU benchmark tests that run only via local CLI entry points",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs/archive/files"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["B", "UP", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/gpu_env_support.py" = ["E402"]

[tool.vulture]
paths = ["src", "experiments", "tests"]
min_confidence = 100

[tool.coverage.run]
branch = true
source = [
	"src/taac2026/domain",
	"src/taac2026/application/bootstrap",
	"src/taac2026/application/evaluation",
	"src/taac2026/application/experiments",
	"src/taac2026/application/packaging",
	"src/taac2026/application/training",
	"src/taac2026/infrastructure/bundles",
	"src/taac2026/infrastructure/data",
	"src/taac2026/infrastructure/experiments",
	"src/taac2026/infrastructure/modeling",
	"src/taac2026/infrastructure/runtime",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
